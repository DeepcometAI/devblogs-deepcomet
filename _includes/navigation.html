<!-- Begin Menu Navigation
================================================== -->
<nav class="navbar navbar-expand-lg fixed-top mediumnavigation nav-down">
    <div class="container pr-0">
        <!-- Logo -->
        <a class="navbar-brand" href="{{ site.baseurl }}/">
            <span class="logotext">{{ site.name }}</span>
        </a>

        <!-- Toggler -->
        <button class="mobile-menu-toggle" type="button" aria-label="Toggle navigation" onclick="this.classList.toggle('active'); document.getElementById('navbarMediumish').classList.toggle('show');">
            <span class="hamburger">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </span>
        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="navbarMediumish">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item {% if page.url == '/' %}active{% endif %}">
                    <a class="nav-link" href="{{ site.baseurl }}/">Home</a>
                </li>
                <li class="nav-item {% if page.url contains '/about/' %}active{% endif %}">
                    <a class="nav-link" href="{{ site.baseurl }}/about/">About</a>
                </li>
                <li class="nav-item {% if page.url contains '/contact/' %}active{% endif %}">
                    <a class="nav-link" href="{{ site.baseurl }}/contact/">Contact</a>
                </li>
                <li class="nav-item {% if page.url contains '/archive/' %}active{% endif %}">
                    <a class="nav-link" href="{{ site.baseurl }}/archive/">Archive</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://ai.deepcomet.space" target="_blank">Main Site</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://docs.deepcomet.space" target="_blank">Docs</a>
                </li>
            </ul>

            <!-- Social -->
            <ul class="navbar-nav ml-1">
                <li class="nav-item">
                    <a class="nav-link" href="https://github.com/Nehal-aditya" target="_blank"><i class="fab fa-github"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://twitter.com/deepcometai" target="_blank"><i class="fab fa-twitter"></i></a>
                </li>
            </ul>
        </div>

        <!-- Search -->
        <button class="btn btn-link search-btn" id="search-btn" aria-label="Search">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
        </button>

        <!-- Theme Toggle -->
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode" title="Toggle dark/light mode">
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
    </div>
</nav>
<!-- End Navigation
================================================== -->

<!-- Search Modal -->
<div class="search-modal" id="search-modal">
  <div class="search-modal-content">
    <div class="search-modal-header">
      <h3>Search Blog Posts</h3>
      <button class="search-modal-close" id="search-close">&times;</button>
    </div>
    <div class="search-modal-body">
      <input type="text" id="search-input" placeholder="Search for posts..." autocomplete="off">
      <div id="search-results" class="search-results"></div>
    </div>
  </div>
</div>
